name: Fetch Currency Strength

on:
  schedule:
    # 日本時間で毎時2分、7分、12分、17分…に実行
    - cron: '2-59/5 * * * *'
      timezone: "Asia/Tokyo"

  # Actions画面から手動実行
  workflow_dispatch:

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run script
        run: |
          python fetch_strength.py

      - name: Check data.json
        run: |
          echo "=== data.json ==="
          ls -lh data.json
          head -c 500 data.json || true

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "data.json に変更はありません"
          else
            git commit -m "Auto-update currency strength data.json"
            git push
          fi
